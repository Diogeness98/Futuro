name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "phase-0-foundation", "phase-1-core"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: futuro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d futuro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/futuro"
      AUTH_SECRET: "ci-only-secret-value-with-at-least-32-characters"
      JEV_MODE: mock
      RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:deploy
      - run: npm run db:status
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
